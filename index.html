<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пичици</title>
</head>

<body>
</body>
<script>
fetch('./pichici.json', { signal: AbortSignal.timeout(4000) })
  .then(res => res.json())
  .then(data => {
    render(data)
  })
  .catch(err => {
    document.body.innerHTML = '<div>Error - try refresh or return to homepage</div>'
    console.log(err)
  })


function render(pichici) {
  let html = ''
  pichici.forEach(el => {
    html +=
      `<img src="https://jpeg.live.mmcdn.com/stream?room=${el}&f=${Math.random()}" alt="${el}" width="280" height="160" onclick="window.open('https://chaturbate.com/${el}','_blank', 'noopener,noreferrer')">`
  })
  document.body.innerHTML = html
}
</script>
<style>
body {}

img:not([src]),
img[src=""] {
  display: none;
}
</style>
